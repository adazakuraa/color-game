<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="色相環から色を選び、四角形を自由に配置・重ね合わせて配色を楽しむカラーコンビネーションアプリ。">
  <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="いろあわせ">
  <meta name="format-detection" content="telephone=no">
  <title>いろあわせ — Color Combination Studio</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // テーマのちらつき防止（描画前に適用）
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('iroawase:settings:v1') || '{}');
        var t = s.theme === 'dark' || s.theme === 'light' ? s.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
        <input id="workName" class="work-name" type="text" value="無題の作品" maxlength="60" aria-label="作品名" enterkeyhint="done" autocomplete="off">
        <span class="dirty-dot" id="dirtyDot" title="未保存の変更があります" hidden></span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="undoBtn" data-icon="undo" aria-label="元に戻す" title="元に戻す (Ctrl+Z)"></button>
        <button class="icon-btn" id="redoBtn" data-icon="redo" aria-label="やり直す" title="やり直す (Ctrl+Shift+Z)"></button>
        <button class="icon-btn" data-open="canvas" data-icon="canvas" aria-label="キャンバス設定" title="キャンバス設定"></button>
        <button class="icon-btn" id="themeBtn" aria-label="テーマ切り替え" title="ライト／ダーク切り替え"></button>
        <button class="icon-btn" data-open="help" data-icon="help" aria-label="使い方" title="使い方"></button>
      </div>
    </header>

    <main class="stage" id="stage" aria-label="キャンバス">
      <div class="artboard" id="artboard"></div>
      <div class="selection" id="selection" hidden></div>
      <div class="cvd-badge" id="cvdBadge" hidden></div>
    </main>

    <div class="selbar" id="selbar">
      <div class="selbar-hint" id="selHint">四角形をタップして選択</div>
      <div class="selbar-actions" id="selActions" hidden>
        <button class="sel-swatch" id="selSwatch" data-open="color" aria-label="色を選ぶ"><span></span></button>
        <button class="chip-btn" data-act="duplicate" data-icon="copy" data-icon-size="19"><span>複製</span></button>
        <button class="chip-btn" data-act="front" data-icon="front" data-icon-size="19"><span>前面</span></button>
        <button class="chip-btn" data-act="back" data-icon="back" data-icon-size="19"><span>背面</span></button>
        <button class="chip-btn danger" data-act="delete" data-icon="trash" data-icon-size="19"><span>削除</span></button>
      </div>
    </div>

    <section class="sheet" id="sheet" hidden aria-labelledby="sheetTitle">
      <div class="sheet-head" id="sheetHead">
        <div class="grab" aria-hidden="true"></div>
        <h2 id="sheetTitle">パネル</h2>
        <button class="icon-btn" id="sheetClose" data-icon="close" aria-label="閉じる"></button>
      </div>
      <div class="sheet-body" id="sheetBody">
        <div class="panel" data-panel="color"></div>
        <div class="panel" data-panel="insight"></div>
        <div class="panel" data-panel="extract"></div>
        <div class="panel" data-panel="works"></div>
        <div class="panel" data-panel="export"></div>
        <div class="panel" data-panel="canvas"></div>
        <div class="panel" data-panel="help"></div>
      </div>
    </section>

    <nav class="toolbar" aria-label="メインメニュー">
      <button class="tool add" id="addBtn" data-icon="plus" data-icon-size="24"><span>追加</span></button>
      <button class="tool" data-open="color" data-icon="color"><span>色</span></button>
      <button class="tool" data-open="insight" data-icon="insight"><span>解説</span></button>
      <button class="tool" data-open="extract" data-icon="image"><span>抽出</span></button>
      <button class="tool" data-open="works" data-icon="folder"><span>作品</span></button>
      <button class="tool" data-open="export" data-icon="download"><span>画像</span></button>
    </nav>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>

  <noscript><p class="noscript">このアプリを利用するには JavaScript を有効にしてください。</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
